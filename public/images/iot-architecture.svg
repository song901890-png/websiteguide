<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">사물인터넷(IoT) 4계층 아키텍처</title>
  <desc id="d">센서와 기기가 있는 디바이스 계층에서 수집한 데이터가 네트워크 계층을 거쳐 엣지·플랫폼 계층에서 처리되고, 애플리케이션 계층에서 대시보드와 자동화로 활용되는 흐름. 보안은 모든 계층에 걸쳐 적용된다.</desc>
  <rect width="960" height="520" fill="#f8fafc"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <g font-size="15">
    <rect x="40" y="380" width="740" height="100" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="64" y="418" font-size="20" font-weight="800" fill="#1e1b4b">1. 디바이스(인지) 계층</text>
    <text x="64" y="450" fill="#334155">센서 · 액추에이터 · MCU 펌웨어 — 온습도 센서, 스마트 플러그, PLC, 웨어러블</text>

    <rect x="40" y="260" width="740" height="100" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="64" y="298" font-size="20" font-weight="800" fill="#0c4a6e">2. 네트워크(연결) 계층</text>
    <text x="64" y="330" fill="#334155">Wi-Fi · BLE · Zigbee · Thread · LoRaWAN · NB-IoT · LTE-M · 5G</text>

    <rect x="40" y="140" width="740" height="100" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="64" y="178" font-size="20" font-weight="800" fill="#064e3b">3. 엣지·플랫폼 계층</text>
    <text x="64" y="210" fill="#334155">게이트웨이 · MQTT 브로커 · 기기 등록·인증 · 시계열 DB · OTA 업데이트</text>

    <rect x="40" y="20" width="740" height="100" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="64" y="58" font-size="20" font-weight="800" fill="#7c2d12">4. 애플리케이션 계층</text>
    <text x="64" y="90" fill="#334155">대시보드 · 알림 · 자동화 규칙 · AI 분석 (예지보전, 에너지 최적화)</text>

    <line x1="720" y1="378" x2="720" y2="364" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="720" y1="258" x2="720" y2="244" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="720" y1="138" x2="720" y2="124" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>

    <rect x="810" y="20" width="110" height="460" rx="16" fill="#0f172a"/>
    <text x="865" y="235" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">보안</text>
    <text x="865" y="262" font-size="13" fill="#cbd5e1" text-anchor="middle">전 계층 적용</text>
    <text x="865" y="300" font-size="12" fill="#94a3b8" text-anchor="middle">기기 인증서</text>
    <text x="865" y="320" font-size="12" fill="#94a3b8" text-anchor="middle">TLS/DTLS</text>
    <text x="865" y="340" font-size="12" fill="#94a3b8" text-anchor="middle">서명된 OTA</text>
  </g>
</svg>
